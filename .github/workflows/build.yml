name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android 35 SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore release signing key (optional)
        env:
          FLOW_KEYSTORE_BASE64: ${{ secrets.FLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FLOW_KEYSTORE_BASE64" ]; then
            printf '%s' "$FLOW_KEYSTORE_BASE64" | base64 --decode > keystore.jks
          else
            echo "::warning::No release keystore secret configured. This build uses the temporary CI debug key; it will not support seamless updates across fresh runners."
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build optimized APK
        env:
          FLOW_KEYSTORE_PASSWORD: ${{ secrets.FLOW_KEYSTORE_PASSWORD }}
          FLOW_KEY_ALIAS: ${{ secrets.FLOW_KEY_ALIAS }}
          FLOW_KEY_PASSWORD: ${{ secrets.FLOW_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlowLauncher
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
